# [B16-A F9] The deterministic prompt-to-Gerber manufacturing path runs in CI on
# every pull request and on main: fake provider adapter, committed KiCad
# fixtures, committed router recordings replayed by placed-board revision (the
# bundled FreeRouting runtime is local-only), frozen clock, deterministic UUIDs,
# pinned release identities (archive sha256, release id, board revision).
# No credentials, no database, no network. A drift in ANY identity fails here.
#
# [B16-B] The `database-delivery` job proves the migration mechanism on a
# disposable in-process PostgreSQL (PGlite): clean / upgrade / replay / drift /
# interruption, executable RLS and CHECK behaviour, schema-first parity, and
# that every DB-backed test is opt-in (no marker → skipped, never failed).
name: deterministic-manufacturing

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prompt-to-gerber:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # The acceptance suite writes its evidence (ZIP, manifest, check tables) here — never under the repository.
      # (a literal path: the `runner` context is not available in job-level env)
      SIRKIT_B16_1C_EVIDENCE_DIR: /tmp/sirkit-b16-1c-evidence
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.2.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc --noEmit
      # Narrow, deterministic suites only (never the whole suite here): the
      # acceptance + recovery pipelines, the manufacturing routes and their
      # hardening tests, the fabrication gate, the browser workflow panel, the
      # invariant tripwires and the locale-independence proof.
      - run: >-
          pnpm exec vitest run
          app/lib/workflow/prompt-to-gerber/__tests__
          app/api/pcb/qualify app/api/pcb/release
          app/api/__tests__/b16-0-15-tranche-parity.test.ts
          app/api/__tests__/b16-1c-invariant-tripwires.test.ts
          app/api/__tests__/b16-a-review-corrections-tripwires.test.ts
          app/api/pcb-sync/__tests__
          app/lib/pcb/fab/__tests__
          app/lib/pcb-sync/__tests__
          app/lib/pcb/__tests__/b16-a-locale-independent-identities.test.ts
          app/lib/auth/__tests__/b16-a-correlation-id.test.ts
          app/components/pcb/__tests__/manufacturing-workflow-panel.test.tsx
          app/api/physical-bindings/__tests__
          app/lib/pcb/__tests__/b16-c-fabrication-rule-authority.test.ts
          app/lib/fixture-runtime
          app/components/pcb/__tests__/component-review-panel.test.tsx
          app/components/pcb/__tests__/snapshot-conflict-dialog.test.tsx
          app/components/pcb/__tests__/board-revision-dialog.test.tsx
          app/lib/pcb/lifecycle/__tests__/b16-c-strict-mode-remount.test.tsx
          app/components/pcb/__tests__/pcb3d-view-session.test.tsx
          app/lib/engineering/__tests__/action-registry.test.ts
          app/lib/engineering/__tests__/b17-a-control-inventory.test.ts
          app/lib/view-session
          --reporter=dot --reporter=junit --outputFile=vitest-deterministic-manufacturing.xml
      - name: Upload evidence and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deterministic-manufacturing-evidence
          path: |
            vitest-deterministic-manufacturing.xml
            /tmp/sirkit-b16-1c-evidence/b16-1c-acceptance-evidence.json
            /tmp/sirkit-b16-1c-evidence/b16-1c-acceptance-release.zip
          if-no-files-found: ignore
          retention-days: 14

  database-delivery:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.2.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # No DATABASE_URL, no qualification marker: the DB-backed suites must report SKIPPED, the disposable-PostgreSQL proofs must PASS.
      - run: >-
          pnpm exec vitest run
          app/lib/db
          app/lib/pcb/__tests__/ingest-integrity.test.ts
          app/lib/physical-binding/__tests__/schema-integrity.test.ts
          app/lib/durable-workflow/__tests__/tenant-scope.test.ts
          --reporter=dot --reporter=junit --outputFile=vitest-database-delivery.xml
      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: database-delivery-diagnostics
          path: vitest-database-delivery.xml
          if-no-files-found: ignore
          retention-days: 14

  # [B16-C.5] The page-level browser proof: a real Chromium drives the real
  # Next.js application under the env-gated fixture runtime (in-memory stores,
  # recorded provider design, recorded router replay, dev-only role cookie).
  # No database, no credits, no live router; live provider/auth variations stay
  # opt-in elsewhere.
  page-browser-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.2.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm exec playwright test
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: page-browser-e2e-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 14
