  # [B24-D4] OD-30: page-browser-e2e came within five minutes of its limit at B24-D3's run (27 min 40 s of 30, headroom 2 min 20 s),
  # so B24's own browser specs run here instead - B24-D2's multi-tab and crash-recovery, B24-D3's keyboard-and-focus and minimum-width;
  # page-browser-e2e's first browser step leaves them out through SIRKIT_E2E_SKIP. The same setup steps; no secret, database or live resource.
  page-browser-e2e-b24:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: "true"
    steps:
      - run: echo "SIRKIT_JOB_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV" # [B24-D1] OD-30: page-browser-e2e-b24's start
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.2.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: B24's browser specs (B24-D2's two, B24-D3's two; OD-30's split)
        run: pnpm exec playwright test e2e/multi-tab.spec.ts e2e/crash-recovery.spec.ts e2e/keyboard-and-focus.spec.ts e2e/minimum-width.spec.ts
      - name: Upload browser evidence (B24's specs)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: page-browser-e2e-b24-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 14
      - if: always() # [B24-D1] OD-30: page-browser-e2e-b24's headroom
        run: pnpm exec tsx scripts/ci-job-headroom.ts .github/workflows/deterministic-manufacturing.yml page-browser-e2e-b24

  # [PR-L7] OD-30, OD-254: page-browser-e2e reached its 30-minute limit at 0f1c446b's run (73 tests in 28.1 min, then the orchestration
  # step was cancelled), agent-execution alone 1,022 s of it (464 s on the previous green run), so that spec runs here instead;
  # page-browser-e2e's first browser step leaves it out through SIRKIT_E2E_SKIP. The same setup steps; no secret, database or live resource.
  page-browser-e2e-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: "true"
    steps:
      - run: echo "SIRKIT_JOB_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV" # [B24-D1] OD-30: page-browser-e2e-agent's start
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.2.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: The agent-execution browser spec (OD-254; OD-30's split)
        run: pnpm exec playwright test e2e/agent-execution.spec.ts
      - name: Upload browser evidence (the agent-execution spec)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: page-browser-e2e-agent-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 14
      - if: always() # [B24-D1] OD-30: page-browser-e2e-agent's headroom
        run: pnpm exec tsx scripts/ci-job-headroom.ts .github/workflows/deterministic-manufacturing.yml page-browser-e2e-agent
